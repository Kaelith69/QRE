<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
      .bg { fill: #f1f5f9; }
      .surface { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .primary { fill: #2563eb; }
      .text-main { fill: #0f172a; font-family: 'Inter', sans-serif; }
      .text-muted { fill: #64748b; font-family: 'Inter', sans-serif; }
      .wireframe-fill { fill: #e2e8f0; }
    </style>
  </defs>
  <rect width="1200" height="400" class="bg" />
  
  <!-- Left Side: Text -->
  <text x="100" y="200" class="text-main" font-size="56" font-weight="800">Polished Dynamic Resume Builder</text>
  <text x="100" y="250" class="text-muted" font-size="24" font-weight="400">A pure client-side architecture for structured layout generation.</text>
  
  <!-- Right Side: Abstract Layout -->
  <g transform="translate(850, 60)">
    <rect width="240" height="340" rx="8" class="surface" />
    <rect x="20" y="30" width="100" height="15" rx="4" class="primary" />
    <rect x="20" y="55" width="60" height="8" rx="4" class="wireframe-fill" />
    <rect x="20" y="80" width="200" height="60" rx="4" class="wireframe-fill" />
    <rect x="20" y="150" width="95" height="120" rx="4" class="wireframe-fill" />
    <rect x="125" y="150" width="95" height="120" rx="4" class="wireframe-fill" />
    
    <!-- A smaller scaled page indicating the fitToPage transform -->
    <rect x="-80" y="140" width="160" height="226" rx="6" class="surface" fill-opacity="0.9" />
    <rect x="-65" y="160" width="70" height="10" rx="3" class="primary" />
    <rect x="-65" y="180" width="130" height="40" rx="3" class="wireframe-fill" />
    <rect x="-65" y="230" width="130" height="40" rx="3" class="wireframe-fill" />
    
    <path d="M-60 100 L 10 100" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" fill="none" />
    <circle cx="-60" cy="100" r="4" fill="#2563eb" />
  </g>
</svg>
